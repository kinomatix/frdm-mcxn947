[package]
name = "frdm-mcxn947"
version = "0.1.0"
edition = "2024"

[dependencies]
mcx-pac = { git = "https://github.com/mcx-rs/mcx-pac.git", features = ["rt", "mcxn947_cm33_core0"] }

defmt = "1"
defmt-rtt = "1"

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"

panic-probe = { version = "*" , features = ["print-defmt"] }

futures = { version = "0.3", default-features = false, features = [
    "async-await",
]}

embassy-executor = { version = "0.7", features = ["defmt", "arch-cortex-m", "executor-thread"]}
embassy-time-driver = { version = "0.2" }
embassy-time = { version = "0.4", features = ["defmt"] }
embassy-sync = { version = "*", features = ["defmt"] }
systick-timer = { version = "0.1.1", features = ["cortex-m", "embassy-time-driver"]}

[features]
rt = []

